services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"

  backend:
    build: ./backend
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${APP_DB_USER:-postgres}
      DB_PASSWORD: ${APP_DB_PASSWORD:-${DB_PASSWORD}}
      DB_NAME: portfolio
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_ALLOWED_USER: ${GITHUB_ALLOWED_USER}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL}
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uploads:/app/uploads

  frontend:
    build: .
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
  uploads: