gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/manifest+json application/xml+rss application/atom+xml image/svg+xml font/woff font/woff2 font/ttf;

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10M;
    server_tokens off;

    # These sit at server level so every location inherits them. nginx only
    # passes add_header down to a location that declares none of its own, so
    # the one block below that sets its own Cache-Control has to repeat the
    # whole set - that is the reason for the duplication, not an oversight.
    #
    # static.cloudflareinsights.com and cloudflareinsights.com are Cloudflare
    # Web Analytics: the first serves beacon.min.js, the second receives the
    # measurement. Without both entries the policy blocks the analytics
    # outright - silently, in the browser, which is exactly how the previous
    # analytics setup managed to report nothing for a month.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://challenges.cloudflare.com https://cloudflareinsights.com; frame-src 'self' https://challenges.cloudflare.com; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;

    # Vite fingerprints these filenames with a content hash, so a changed
    # file always gets a new URL - safe to tell browsers to cache forever.
    # Repeats the headers above because declaring Cache-Control here stops
    # nginx inheriting any of them.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://challenges.cloudflare.com https://cloudflareinsights.com; frame-src 'self' https://challenges.cloudflare.com; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    }

    # Was `try_files $uri $uri/ /index.html`, which answered 200 with the
    # front page for every address that does not exist - a soft 404. Google
    # reports those as errors and can index the bogus URLs.
    #
    # It works as a plain file lookup now because scripts/prerender.js writes
    # a real directory for every public route, so anything that is not one of
    # them genuinely is missing. The one client-side route without a file is
    # handled just below.
    location / {
        try_files $uri $uri/ =404;
    }

    # The admin panel is a client-side route and deliberately not
    # prerendered, so it has no file of its own and needs the shell by name.
    # A new client-side route that nobody prerenders belongs here too, or it
    # will 404 - src/tests/routes.test.js fails when one is forgotten.
    # Matches with and without the trailing slash, because a bookmark saved
    # either way has to reach the panel rather than the 404 page.
    location ~ ^/baumi-dashboard/?$ {
        try_files /index.html =404;
    }

    # The branded 404 page, served with a real 404 status. `internal` keeps
    # /404.html from being fetched directly and answering 200, which would
    # reintroduce the soft 404 at a different address.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location /api {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # nginx itself only ever speaks plain HTTP (Caddy terminates TLS in
        # front of it), so $scheme here is always "http" - that would
        # overwrite the X-Forwarded-Proto Caddy already set and break the
        # session cookie's secure flag (see server.js). Pass through
        # whatever Caddy sent instead of substituting nginx's own scheme.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
