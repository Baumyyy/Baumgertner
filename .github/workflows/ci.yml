name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    # Pinned because the browser step below relies on this image already
    # having Chromium's system libraries - confirmed for 24.04 from a run
    # log, not yet for Ubuntu 26, which ubuntu-latest became on 19 Oct 2026.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      # Matches the production Dockerfile, which needs --legacy-peer-deps
      # for the same dependency tree.
      - run: npm ci --legacy-peer-deps

      # npm run build ends with the prerender step, which needs a browser.
      # No --with-deps: the runner image already has every library Chromium
      # needs, and --with-deps only added CJK/Thai/Cyrillic fonts via apt -
      # which failed CI three times on 11 Nov 2026 when the runner could not
      # resolve azure.archive.ubuntu.com. The browser itself downloads from
      # Playwright's CDN, not apt. If Chromium ever fails to launch with a
      # missing .so error, the image dropped a library: add --with-deps back.
      - run: npx playwright install chromium

      - run: npm run lint
      - run: npm run build
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: portfolio
      SESSION_SECRET: ci-test-session-secret
      GITHUB_CLIENT_ID: ci-test-client-id
      GITHUB_CLIENT_SECRET: ci-test-client-secret
      GITHUB_ALLOWED_USER: ci-test-user
      GITHUB_CALLBACK_URL: http://localhost:3001/api/auth/github/callback
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Runs as the postgres superuser (the CI service container has no
      # separate least-privilege role), so this can create the schema
      # directly - see backend/db-admin.js.
      - run: node init.js

      - run: npm test
